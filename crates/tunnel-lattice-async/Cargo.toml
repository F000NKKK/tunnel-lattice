[package]
name = "tunnel-lattice-async"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Runtime-agnostic futures Stream adapter for Tunnel Lattice: native over AsyncPacketIo when available, thread-bridged over PacketIo otherwise."
readme = "README.md"

[dependencies]
tunnel-lattice-core = { workspace = true }
tunnel-lattice-platform = { workspace = true, features = ["async"] }

futures = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

# Packet-path throughput benchmarks over in-memory mock devices (no
# privilege, no real device). Build-checked in CI with `--no-run`.
[[bench]]
name = "packet_stream"
harness = false

# `PacketPool` construction cost (mock-free, no device).
[[bench]]
name = "pool"
harness = false

# The provided per-packet `send_batch` path at several batch sizes, over an
# in-memory sink (no privilege, no real device).
[[bench]]
name = "batch_send"
harness = false

# Counts heap allocations per received packet with a counting global
# allocator, which needs its own binary (no libtest harness allocating
# concurrently on the main thread).
[[test]]
name = "alloc_count"
harness = false
