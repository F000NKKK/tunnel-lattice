[package]
name = "tunnel-lattice-model"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
description = "Operating-system-independent TUN/TAP domain types for Tunnel Lattice. Models data and contracts; never inspects or mutates the host system."
readme = "README.md"

[package.metadata.docs.rs]
# Show the `backend` support module on docs.rs (labelled by its feature).
features = ["backend"]

[features]
# Exposes `pub mod backend`: the OS-independent rules that Tunnel Lattice
# backend crates share. Support API for backend authors, not covered by any
# stability promise; the facade never enables it.
backend = []

[dependencies]
tunnel-lattice-core = { workspace = true }
