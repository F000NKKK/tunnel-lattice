[package]
name = "tunnel-lattice-backend-tunrs"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
description = "tun-rs-backed cross-platform TUN/TAP backend for Tunnel Lattice, implementing tunnel-lattice-platform's provider traits."
readme = "README.md"

[features]
# Internal marker: "we have a tun_rs::AsyncDevice handle", turned on by
# whichever concrete async runtime feature below is selected. Never enable
# this directly.
async = ["tunnel-lattice-platform/async", "dep:futures"]
# `async-io`/`tokio` select tun-rs's own two mutually exclusive async
# backends (verified in tun-rs 2.8.11's Cargo.toml: `async_io` = async-io +
# `blocking`, no tokio dependency; `async_tokio` = tokio + `blocking`).
# Enable exactly one — tun-rs itself hard-errors
# ("More than one asynchronous runtime is simultaneously specified in
# features") if both are active in the same build, so `--all-features` is
# not a valid way to build this crate; test each feature set separately.
async-io = ["async", "tun-rs/async_io"]
# `dep:tokio` is required, not just tun-rs's own tokio pull-in: `PacketIo`'s
# blocking `recv`/`send` must drive tun-rs's Tokio-backed `AsyncDevice`
# through the caller's own entered runtime (`Handle::current().block_on`),
# not through `futures::executor::block_on` — that foreign executor never
# polls Tokio's I/O driver, so the future's readiness notification never
# arrives and the call hangs forever (verified: a real `send()` deadlocked
# under a 10s timeout before this was fixed). `async-io`'s `AsyncDevice` has
# no such requirement — it's built on the runtime-agnostic `async-io` crate.
tokio = ["async", "tun-rs/async_tokio", "dep:tokio"]

[dependencies]
tunnel-lattice-core = { workspace = true }
tunnel-lattice-model = { workspace = true }
tunnel-lattice-platform = { workspace = true }
tun-rs = { workspace = true }
futures = { workspace = true, optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net"], optional = true }
