[package]
name = "tunnel-lattice-backend-tunrs"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
categories.workspace = true
keywords.workspace = true
description = "tun-rs-backed cross-platform TUN/TAP backend for Tunnel Lattice, implementing tunnel-lattice-platform's provider traits."
readme = "README.md"

[features]
# Internal marker: "we have a tun_rs::AsyncDevice handle", turned on by
# whichever concrete async runtime feature below is selected. Never enable
# this directly.
async = ["tunnel-lattice-platform/async", "dep:futures", "dep:blocking"]
# `async-io`/`tokio` select tun-rs's own two mutually exclusive async
# backends (verified in tun-rs 2.8.11's Cargo.toml: `async_io` = async-io +
# `blocking`, no tokio dependency; `async_tokio` = tokio + `blocking`).
# Enable exactly one — tun-rs itself hard-errors
# ("More than one asynchronous runtime is simultaneously specified in
# features") if both are active in the same build, so `--all-features` is
# not a valid way to build this crate; test each feature set separately.
async-io = ["async", "tun-rs/async_io"]
# `dep:tokio` is required, not just tun-rs's own tokio pull-in: `PacketIo`'s
# blocking `recv`/`send` must drive tun-rs's Tokio-backed `AsyncDevice`
# through the caller's own entered runtime (`Handle::current().block_on`),
# not through `futures::executor::block_on` — that foreign executor never
# polls Tokio's I/O driver, so the future's readiness notification never
# arrives and the call hangs forever (verified: a real `send()` deadlocked
# under a 10s timeout before this was fixed). `async-io`'s `AsyncDevice` has
# no such requirement — it's built on the runtime-agnostic `async-io` crate.
tokio = ["async", "tun-rs/async_tokio", "dep:tokio"]

[dependencies]
tunnel-lattice-core = { workspace = true }
tunnel-lattice-model = { workspace = true }
tunnel-lattice-platform = { workspace = true }
tun-rs = { workspace = true }
futures = { workspace = true, optional = true }
# The latest tokio release, matching the workspace's own requirement (tun-rs
# 2.8.11 needs 1.49; the Linux error-aware receive path needs
# `Interest::ERROR` (1.32) and `task::coop::consume_budget` (1.44)).
tokio = { version = "1.53.1", default-features = false, features = ["rt", "rt-multi-thread", "net"], optional = true }

# `if_nametoindex`, used by `open` to tell an existing-name conflict apart
# from other `EINVAL`/`EBUSY` failures, and on Linux the `TUNSETPERSIST`
# ioctl `unpersist` issues itself (tun-rs can only set the flag). Already
# locked via tun-rs; adds no package to Cargo.lock.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2.189"

# The macOS TAP receive path in async builds runs its bounded BPF wait on
# the `blocking` thread pool (see `src/macos_tap.rs`), the pool tun-rs itself
# waits on there. tun-rs 2.8.11 already requires `blocking` 1.6 for both of
# its async backends (locked at 1.7.0), so this adds no package to
# Cargo.lock. Enabled by the internal `async` feature.
[target.'cfg(target_os = "macos")'.dependencies]
blocking = { version = "1.7.0", optional = true }

# `open` recognizes a failed wintun.dll load by downcasting the
# `libloading::Error` that tun-rs wraps with `io::Error::other`. This MUST
# track the libloading major version tun-rs itself depends on (0.9 as of
# tun-rs 2.8.11): with two majors in the graph the downcast would silently
# stop matching. CI enforces a single version with
# `cargo tree --target x86_64-pc-windows-msvc -i libloading`.
[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.9.0"
# `TunRsBackend::capabilities` probes for the tap-windows6 (`tap0901`)
# driver through SetupAPI (see `src/windows_tap_probe.rs`), following the
# driver lookup tun-rs's own `open(Tap)` performs, without creating a
# device. `snapshot` reads the administrative state with `GetIfEntry2`
# (`Win32_NetworkManagement_IpHelper`, keyed by a `NET_LUID_LH` from
# `Win32_NetworkManagement_Ndis`); tun-rs 2.8.11 already enables both
# features. Already locked at 0.61.2 via tun-rs 2.8.11; adds no package to
# Cargo.lock.
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
] }

# Test-only: the privileged teardown tests drive a real device through
# `tunnel-lattice-async`'s `PacketStream` (the native adapter in async
# builds, the thread bridge in the sync build) and delete or disable the
# device underneath it.
[dev-dependencies]
tunnel-lattice-async = { workspace = true }
futures = { workspace = true }
