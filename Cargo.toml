[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MPL-2.0"
repository = "https://github.com/F000NKKK/tunnel-lattice"
homepage = "https://github.com/F000NKKK/tunnel-lattice"
documentation = "https://docs.rs/tunnel-lattice"
authors = ["Tunnel Lattice Contributors", "F000NK"]
categories = ["network-programming", "os"]
keywords = ["cross-platform","rust","networking","tunnel","tun"]

# Single source of truth for every internal crate's version + path, mirroring
# net-lattice's workspace-dependency pattern (see ARCHITECTURE.md's API
# Stability Rules for why each crate's version is independent).
[workspace.dependencies]
tunnel-lattice-core = { path = "crates/tunnel-lattice-core", version = "0.6.0" }
tunnel-lattice-model = { path = "crates/tunnel-lattice-model", version = "0.6.0" }
tunnel-lattice-platform = { path = "crates/tunnel-lattice-platform", version = "0.6.0" }
tunnel-lattice-backend-tunrs = { path = "crates/tunnel-lattice-backend-tunrs", version = "0.6.0" }
tunnel-lattice-async = { path = "crates/tunnel-lattice-async", version = "0.6.0" }
tunnel-lattice = { path = "crates/tunnel-lattice", version = "0.6.0" }

# External requirements track the latest release of each dependency (kept
# identical to net-lattice/dns-lattice where they share one), within the
# 1.93 MSRV.
bitflags = "2.13.2"
futures = "0.3.34"
# Dev-only: packet-path benchmarks in tunnel-lattice-async. No default
# features (no rayon/plotters); 0.8.2 needs Rust 1.86, below our 1.93 floor.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tokio = { version = "1.53.1", default-features = false }

# Initial TUN/TAP backend (see ARCHITECTURE.md, "Backend replacement plan"):
# tun-rs is itself cross-platform (Linux/Windows/macOS/*BSD/iOS/Android), so
# tunnel-lattice-backend-tunrs is one shared crate rather than net-lattice's
# per-OS split. The floor is 2.8.11 because tunnel-lattice-backend-tunrs's
# `open` error classifier and name prechecks were verified against that
# release's source (error messages, `feth`/`utun` naming, libloading 0.9).
# Re-verified on 2026-10-01 for the 0.5 release: 2.8.11 is both the latest
# tun-rs on crates.io and the version Cargo.lock resolves, and every pinned
# message, error kind, feature name and the libloading major were re-checked
# against its source. Re-checked on 2026-10-02 for the 0.6 release: 2.8.11
# is still the latest tun-rs and the locked version, so that verification
# still holds. The Linux segmentation offload parses the virtio-net header
# itself and uses none of tun-rs's hidden offload helpers, so it adds no
# tighter coupling. Not exact-pinned: this is a library, so a downstream
# lockfile may resolve a newer 2.x; the privileged CI job's Windows
# missing-driver tests detect a newer tun-rs that changes the errors the
# classifier relies on.
tun-rs = { version = "2.8.11", default-features = false }
