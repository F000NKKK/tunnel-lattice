name: CI

# Runs fmt/clippy/check/test/doc across the three platforms tunnel-lattice
# targets, on GitHub's native runners for each OS — not cross-compiled — so
# tun-rs and tunnel-lattice-backend-tunrs are actually compiled and tested
# per platform, not just on Linux. Creating/opening a real TUN/TAP device
# needs elevated privileges this job does not have, so ordinary tests here
# cover construction/model logic; add a privileged job (see net-lattice's
# `.github/workflows/ci.yml` for the pattern) once device-level tests land.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.1

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check --workspace --all-features
        run: cargo check --workspace --all-features

      - name: cargo test --workspace --all-features
        run: cargo test --workspace --all-features

      - name: cargo doc --no-deps --workspace --all-features
        run: cargo doc --no-deps --workspace --all-features
