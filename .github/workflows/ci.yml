name: CI

# Runs fmt/clippy/check/test/doc across the three platforms tunnel-lattice
# targets, on GitHub's native runners for each OS — not cross-compiled — so
# tun-rs and tunnel-lattice-backend-tunrs are actually compiled and tested
# per platform, not just on Linux. The `ci` job's tests do not have the
# privilege to open a real TUN/TAP device, so they cover construction/model
# logic only; the `privileged` job below (mirroring net-lattice's own
# pattern) actually opens, mutates, and tears down a real device on each
# platform via the `#[ignore]`d `privileged_tests` of
# `tunnel-lattice-backend-tunrs` and of the `tunnel-lattice` facade.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci (${{ matrix.os }}, ${{ matrix.features.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # tun-rs hard-errors ("More than one asynchronous runtime is
        # simultaneously specified in features") if its async-io and tokio
        # backends are both enabled at once, so `--all-features` is not a
        # valid way to build this workspace. Exercise the three supported,
        # mutually exclusive feature sets instead.
        features:
          - name: default
            flags: ""
          - name: async-io
            flags: "--no-default-features --features tunnel-lattice/tun-rs,tunnel-lattice/async-io"
          - name: tokio
            flags: "--no-default-features --features tunnel-lattice/tun-rs,tunnel-lattice/tokio"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.features.name }}

      - name: cargo fmt --check
        run: cargo fmt --check
        if: matrix.features.name == 'default'

      # tunnel-lattice-backend-tunrs recognizes a failed wintun.dll load by
      # downcasting the `libloading::Error` tun-rs wraps; that only works
      # while both crates use the same libloading version. `cargo tree -i`
      # fails outright when the spec is ambiguous (two versions) or matches
      # nothing, and the line count check below catches anything else.
      # `--target` makes this host-independent, so it runs once.
      - name: libloading single-version guard (Windows target)
        if: matrix.os == 'ubuntu-latest' && matrix.features.name == 'default'
        shell: bash
        run: |
          versions="$(cargo tree --target x86_64-pc-windows-msvc -i libloading -e normal --depth 0 --prefix none)" || exit 1
          echo "$versions"
          test "$(printf '%s\n' "$versions" | wc -l)" -eq 1 || exit 1

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets ${{ matrix.features.flags }} -- -D warnings

      - name: cargo check --workspace
        run: cargo check --workspace ${{ matrix.features.flags }}

      - name: cargo test --workspace
        run: cargo test --workspace ${{ matrix.features.flags }}

      - name: cargo doc --no-deps --workspace
        run: cargo doc --no-deps --workspace ${{ matrix.features.flags }}

      # Benches run on mocks and are not timed in CI (shared runners are too
      # noisy); this only proves they still build in release mode, once per
      # OS. `tunnel-lattice-async` has no features of its own, so the other
      # feature sets would build it identically (their clippy
      # `--all-targets` step above still type-checks the benches).
      - name: cargo bench -p tunnel-lattice-async --no-run
        if: matrix.features.name == 'default'
        run: cargo bench -p tunnel-lattice-async --no-run

  # Runs the packet-pool unit tests (the only `unsafe` in
  # tunnel-lattice-async: the slab allocation and slot views) under Miri to
  # catch undefined behaviour the ordinary tests cannot see. Non-blocking:
  # Miri needs a nightly toolchain, which can break independently of this
  # repository, so a failure here is reported but does not fail the run.
  # The `pool` filter selects `pool::tests::*`; tunnel-lattice-async has no
  # features of its own, so one Linux job covers it.
  miri:
    name: miri (tunnel-lattice-async pool, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (nightly + miri)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: cargo miri setup
        run: cargo +nightly miri setup

      - name: cargo +nightly miri test -p tunnel-lattice-async --lib pool
        run: cargo +nightly miri test -p tunnel-lattice-async --lib pool

  privileged:
    name: privileged (${{ matrix.os }}, ${{ matrix.features.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        features:
          # `facade_flags` selects the same feature set for the
          # `tunnel-lattice` facade's own ignored tests, which exist only
          # with an async feature (none for `default`).
          - name: default
            flags: ""
            facade_flags: ""
          - name: async-io
            flags: "--no-default-features --features tunnel-lattice-backend-tunrs/async-io"
            facade_flags: "--no-default-features --features tunnel-lattice/tun-rs,tunnel-lattice/async-io"
          - name: tokio
            flags: "--no-default-features --features tunnel-lattice-backend-tunrs/tokio"
            facade_flags: "--no-default-features --features tunnel-lattice/tun-rs,tunnel-lattice/tokio"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: privileged-${{ matrix.features.name }}

      # Must run before "Download wintun.dll" (and before any TAP driver
      # install step): these two ignored tests assert that `open(Tun)`
      # without wintun.dll and `open(Tap)` without the tap-windows6 driver
      # both report `Error::DriverUnavailable`. They are the end-to-end check
      # that the backend's wintun/"No driver found" recognition still
      # matches what the resolved tun-rs actually returns. `GITHUB_PATH`
      # only affects later steps, so nothing has to be moved or restored.
      # A name filter that matches nothing still exits 0, so the step also
      # requires the unit-test binary to report exactly those two tests
      # passed (a rename would otherwise turn this check into a no-op).
      - name: cargo test -p tunnel-lattice-backend-tunrs -- --ignored windows_missing_driver_ (Windows, before driver install)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/missing-driver-tests.log"
          cargo test -p tunnel-lattice-backend-tunrs ${{ matrix.features.flags }} -- --ignored windows_missing_driver_ --nocapture 2>&1 | tee "$log"
          if ! grep -Eq '^test result: ok\. 2 passed;' "$log"; then
            echo "::error::expected 'test result: ok. 2 passed' from the windows_missing_driver_ tests; the filter matched a different number of tests (renamed or removed?)"
            exit 1
          fi

      # tun-rs's TUN mode on Windows loads wintun.dll at runtime (not linked
      # at build time) and does not vendor it — see tun-rs's own README,
      # "Windows" / "wintun.dll not found." Without this, every
      # `TunRsBackend::open` call for a TUN device on Windows fails — now
      # with `Error::DriverUnavailable`; releases up to 0.4 reported a
      # generic `Platform(Windows(0))` (confirmed on a real run: no raw OS
      # error code, because tun-rs's own "DLL not found" error isn't a Win32
      # error at all). Pinned to 0.14.1, the same long-standing stable build
      # WireGuard itself ships. Downloaded at CI time rather than committed
      # to the repo to avoid bundling a third-party binary and its license
      # question into version control.
      - name: Download wintun.dll (tun-rs's Windows TUN backend)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          Expand-Archive -Path wintun.zip -DestinationPath wintun
          echo "$PWD\wintun\wintun\bin\amd64" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Stages (does not install) the tap-windows6 `tap0901` driver package
      # in the driver store. tun-rs's TAP open, and the backend's host-level
      # driver lookup, search the store for a compatible driver with
      # hardware id tap0901 and create their own adapter, so no adapter is
      # created here (`devcon install`/`tapctl create` would leave an extra
      # one behind and break the leak check below). Pinned to 9.27.0, the
      # latest release, by SHA-256; the catalog must carry a valid
      # Authenticode signature. The package is attestation-signed for
      # Windows 10/11 client; the Server-based hosted image loads it because
      # it runs with test signing on (printed below for the log). MUST stay
      # after the `windows_missing_driver_` step, which asserts the driver
      # is absent.
      - name: Stage the tap-windows6 driver (tap0901) in the driver store (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = '9.27.0'
          $sha256  = '36E2609B7CEEFEDCB978CE5C48CAF9E0E5AF83423717C4E2E3C1D7EBCA8F62A5'
          $zip = Join-Path $env:RUNNER_TEMP 'tap-windows6.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'tap-windows6'
          Invoke-WebRequest -Uri "https://github.com/OpenVPN/tap-windows6/releases/download/$version/dist.win10.zip" -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash
          if ($got -ne $sha256) { throw "tap-windows6 $version checksum mismatch: $got" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $amd64 = Join-Path $dir 'dist.win10\amd64'
          $sig = Get-AuthenticodeSignature -LiteralPath (Join-Path $amd64 'tap0901.cat')
          if ($sig.Status -ne 'Valid') { throw "tap0901.cat signature is $($sig.Status): $($sig.StatusMessage)" }
          bcdedit /enum '{current}' | Select-String -Pattern 'testsigning'
          pnputil /add-driver (Join-Path $amd64 'OemVista.inf')
          if ($LASTEXITCODE -notin 0, 3010) { throw "pnputil /add-driver failed with exit code $LASTEXITCODE" }
          # One `pnputil /enum-drivers` block per package; require the one
          # this step staged (its original INF name, the provider its INF
          # declares, and its version), not just any package once called
          # OemVista.inf.
          $blocks = (pnputil /enum-drivers | Out-String) -split '\r?\n\s*\r?\n'
          $staged = @($blocks | Where-Object {
            $_ -match '(?im)^\s*Original Name:\s*oemvista\.inf\s*$' -and
            $_ -match '(?im)^\s*Provider Name:\s*TAP-Windows Provider V9\s*$' -and
            $_ -match "(?im)^\s*Driver Version:.*\b$([regex]::Escape($version))\.0\s*$"
          })
          if ($staged.Count -eq 0) {
            pnputil /enum-drivers /class Net
            throw "tap-windows6 $version (tap0901) not found in the driver store after pnputil /add-driver"
          }
          $staged | Write-Host
          exit 0

      # `-p tunnel-lattice-backend-tunrs` only: `privileged_tests` lives
      # there, and building the rest of the workspace under `sudo`/as
      # Administrator is unnecessary privilege widening for no benefit.
      - name: cargo test -p tunnel-lattice-backend-tunrs -- --ignored (Linux/macOS, sudo)
        if: matrix.os != 'windows-latest'
        run: sudo env "PATH=$PATH" "HOME=$HOME" cargo test -p tunnel-lattice-backend-tunrs ${{ matrix.features.flags }} -- --ignored --nocapture

      # The facade's own `privileged_tests` (`packet_stream` dispatch and
      # `send_async` on a real TUN device), unit tests only (`--lib`): the
      # integration tests and doctests need no privilege and already run in
      # the `ci` job.
      - name: cargo test -p tunnel-lattice --lib -- --ignored (Linux/macOS, sudo)
        if: matrix.os != 'windows-latest' && matrix.features.name != 'default'
        run: sudo env "PATH=$PATH" "HOME=$HOME" cargo test -p tunnel-lattice --lib ${{ matrix.features.facade_flags }} -- --ignored --nocapture

      # Every Linux TAP device the privileged tests create is non-persistent
      # and goes away when its handle drops (at the latest when the test
      # process exits), and the runner starts with none. Fails the job if a
      # TAP device (`tun type tap` in the link details) is left on the
      # runner, also after a failed test run.
      - name: No TAP device left behind (Linux)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        run: |
          leftover=$(ip -d -o link show | grep -E '\btun type tap\b' || true)
          if [ -n "$leftover" ]; then
            echo "$leftover"
            echo "::error::TAP devices left behind by the privileged tests: $(echo "$leftover" | awk -F': ' '{print $2}' | tr '\n' ' ')"
            exit 1
          fi

      # A macOS TAP device is a `feth` interface pair, a cloned interface
      # that outlives the test process, so the privileged tests must tear
      # down every pair they create (the device's own drop, or the tests'
      # teardown guards on a failure). Fails the job if any `feth` interface
      # is left on the runner, also after a failed test run.
      - name: No feth interface left behind (macOS)
        if: ${{ !cancelled() && matrix.os == 'macos-latest' }}
        run: |
          leftover=$(ifconfig -l | tr ' ' '\n' | grep '^feth' || true)
          if [ -n "$leftover" ]; then
            echo "::error::feth interfaces left behind by the privileged tests: $(echo $leftover)"
            exit 1
          fi

      # windows-latest runners already execute as Administrator; opening a
      # TUN/TAP device there does not need an explicit elevation step the
      # way `sudo` provides one on Linux/macOS. The missing-driver tests ran
      # in their own step above and no longer hold once wintun is on PATH
      # and the TAP driver is staged. The Windows TAP tests (`windows_tap_`)
      # serialize themselves on a test-local mutex, so the default parallel
      # test threads are safe.
      - name: cargo test -p tunnel-lattice-backend-tunrs -- --ignored (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo test -p tunnel-lattice-backend-tunrs ${{ matrix.features.flags }} -- --ignored --skip windows_missing_driver_ --nocapture

      # Runs after "Download wintun.dll": these open a TUN device.
      - name: cargo test -p tunnel-lattice --lib -- --ignored (Windows)
        if: matrix.os == 'windows-latest' && matrix.features.name != 'default'
        run: cargo test -p tunnel-lattice --lib ${{ matrix.features.facade_flags }} -- --ignored --nocapture

      # Every TAP adapter the privileged tests create is non-persistent and
      # removed when its handle drops. Fails the job if a tap0901 device is
      # left on the runner, also after a failed test run.
      - name: No TAP-Windows adapter left behind (Windows)
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $left = @(Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object { @($_.HardwareID) -match '(?i)^(root\\)?tap0901$' })
          if ($left.Count -gt 0) {
            $left | Format-Table Status, FriendlyName, InstanceId -AutoSize | Out-String | Write-Host
            Write-Host "::error::TAP-Windows adapters left behind by the privileged tests"
            exit 1
          }

      # On a failure, records why a driver might not have loaded: test
      # signing, the staged packages, devices with a problem code, Code
      # Integrity events, and the tail of the SetupAPI device log.
      - name: TAP driver diagnostics (Windows, on failure)
        if: ${{ failure() && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          bcdedit /enum '{current}'
          pnputil /enum-drivers /class Net
          pnputil /enum-devices /class Net /problem
          Get-WinEvent -LogName 'Microsoft-Windows-CodeIntegrity/Operational' -MaxEvents 30 -ErrorAction SilentlyContinue | Format-List TimeCreated, Id, Message
          Get-Content -Tail 200 "$env:windir\INF\setupapi.dev.log"
          exit 0
