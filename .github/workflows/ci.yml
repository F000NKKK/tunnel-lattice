name: CI

# Runs fmt/clippy/check/test/doc across the three platforms tunnel-lattice
# targets, on GitHub's native runners for each OS — not cross-compiled — so
# tun-rs and tunnel-lattice-backend-tunrs are actually compiled and tested
# per platform, not just on Linux. The `ci` job's tests do not have the
# privilege to open a real TUN/TAP device, so they cover construction/model
# logic only; the `privileged` job below (mirroring net-lattice's own
# pattern) actually opens, mutates, and tears down a real device on each
# platform via `tunnel-lattice-backend-tunrs`'s `#[ignore]`d
# `privileged_tests`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci (${{ matrix.os }}, ${{ matrix.features.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # tun-rs hard-errors ("More than one asynchronous runtime is
        # simultaneously specified in features") if its async-io and tokio
        # backends are both enabled at once, so `--all-features` is not a
        # valid way to build this workspace. Exercise the three supported,
        # mutually exclusive feature sets instead.
        features:
          - name: default
            flags: ""
          - name: async-io
            flags: "--no-default-features --features tunnel-lattice/tun-rs,tunnel-lattice/async-io"
          - name: tokio
            flags: "--no-default-features --features tunnel-lattice/tun-rs,tunnel-lattice/tokio"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.features.name }}

      - name: cargo fmt --check
        run: cargo fmt --check
        if: matrix.features.name == 'default'

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets ${{ matrix.features.flags }} -- -D warnings

      - name: cargo check --workspace
        run: cargo check --workspace ${{ matrix.features.flags }}

      - name: cargo test --workspace
        run: cargo test --workspace ${{ matrix.features.flags }}

      - name: cargo doc --no-deps --workspace
        run: cargo doc --no-deps --workspace ${{ matrix.features.flags }}

  privileged:
    name: privileged (${{ matrix.os }}, ${{ matrix.features.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        features:
          - name: default
            flags: ""
          - name: async-io
            flags: "--no-default-features --features tunnel-lattice-backend-tunrs/async-io"
          - name: tokio
            flags: "--no-default-features --features tunnel-lattice-backend-tunrs/tokio"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: privileged-${{ matrix.features.name }}

      # `-p tunnel-lattice-backend-tunrs` only: `privileged_tests` lives
      # there, and building the rest of the workspace under `sudo`/as
      # Administrator is unnecessary privilege widening for no benefit.
      - name: cargo test -p tunnel-lattice-backend-tunrs -- --ignored (Linux/macOS, sudo)
        if: matrix.os != 'windows-latest'
        run: sudo env "PATH=$PATH" "HOME=$HOME" cargo test -p tunnel-lattice-backend-tunrs ${{ matrix.features.flags }} -- --ignored --nocapture

      # windows-latest runners already execute as Administrator; opening a
      # TUN/TAP device there does not need an explicit elevation step the
      # way `sudo` provides one on Linux/macOS.
      - name: cargo test -p tunnel-lattice-backend-tunrs -- --ignored (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo test -p tunnel-lattice-backend-tunrs ${{ matrix.features.flags }} -- --ignored --nocapture
